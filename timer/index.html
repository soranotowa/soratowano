
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f9f7">
  <meta name="description" content="稼働時間と休憩時間、アラーム音を自由に設定できるインターバルタイマー。">

  <title>インターバルる | トワノソラ</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./timer.js" defer></script>
</head>
<body>
  <main class="app">

    <header class="app-header">
      <h1>
        <span class="title-emoji" aria-hidden="true">🚴</span>
        インターバルる
        <span class="title-emoji" aria-hidden="true">🏃</span>
      </h1>
    </header>

    <section class="timer-panel" aria-label="タイマー">
      <div class="phase-label" id="phase-label">準備OK</div>

      <div class="time-display" id="time-display" role="timer">
        00:30
      </div>

      <p class="next-phase" id="next-phase">
        スタートを押してください
      </p>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="controls">
        <button type="button" class="primary-button" id="start-pause">
          スタート
        </button>
        <button type="button" class="secondary-button" id="reset">
          リセット
        </button>
      </div>
    </section>

    <section class="settings-panel" aria-labelledby="settings-title">
      <h2 id="settings-title">⚙️ 設定 ⚙️</h2>

      <div class="setting-grid">
        <label class="setting-field">
          <span>稼働時間（秒）</span>
          <input type="number" id="work-time"
                 min="1" max="3600" value="30">
        </label>

        <label class="setting-field">
          <span>休憩時間（秒）</span>
          <input type="number" id="rest-time"
                 min="1" max="3600" value="10">
        </label>
      </div>

      <div class="setting-divider"></div>

      <h3>アラーム設定</h3>

      <div class="alarm-setting">
        <label class="setting-field" for="work-sound">
          <span>稼働開始音</span>
          <select id="work-sound">
            <option value="beep">ピッ</option>
            <option value="double" selected>ピピッ</option>
            <option value="chime">ポーン</option>
            <option value="off">無音</option>
          </select>
        </label>
        <button type="button" class="preview-button" id="preview-work">
          試聴 ♪
        </button>
      </div>

      <div class="alarm-setting">
        <label class="setting-field" for="rest-sound">
          <span>休憩開始音</span>
          <select id="rest-sound">
            <option value="beep">ピッ</option>
            <option value="double">ピピッ</option>
            <option value="chime" selected>ポーン</option>
            <option value="off">無音</option>
          </select>
        </label>
        <button type="button" class="preview-button" id="preview-rest">
          試聴 ♪
        </button>
      </div>

      <div class="setting-divider"></div>

      <label class="setting-field" for="countdown-seconds">
        <span>切り替え前のカウントダウン</span>
        <select id="countdown-seconds">
          <option value="0">なし</option>
          <option value="3" selected>3秒前から</option>
          <option value="5">5秒前から</option>
          <option value="10">10秒前から</option>
        </select>
      </label>

      <label class="toggle-setting">
        <span>
          <strong>毎秒の音を鳴らす</strong>
          <small>動作中、1秒ごとに電子音を鳴らします</small>
        </span>
        <input type="checkbox" id="tick-sound">
      </label>

      <div class="volume-setting">
        <label for="alarm-volume">アラーム音量</label>
        <input
          type="range"
          id="alarm-volume"
          min="0"
          max="100"
          step="5"
          value="60"
        >
        <output id="volume-value" for="alarm-volume">60%</output>
      </div>

      <p class="settings-note">
        設定はこのブラウザに保存されます。
        時間を変更するとタイマーはリセットされます。
      </p>
    </section>

    <footer class="app-footer">
      <a href="../" class="footer-link">
        トワノソラのホームページ
      </a>
      <p>© TOWANOSORA</p>
    </footer>

  </main>
</body>
</html>
